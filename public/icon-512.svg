<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer hexagon ring -->
  <polygon
    points="256,32 448,144 448,368 256,480 64,368 64,144"
    stroke="url(#g1)"
    stroke-width="10"
    stroke-opacity="0.15"
    fill="none"
  />

  <!-- Mid hexagon ring -->
  <polygon
    points="256,80 408,168 408,344 256,432 104,344 104,168"
    stroke="url(#g1)"
    stroke-width="3"
    stroke-opacity="0.08"
    fill="none"
  />

  <!-- Left node -->
  <circle cx="160" cy="176" r="36" fill="url(#g1)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="160" cy="176" r="36" fill="url(#g1)" opacity="0.95"/>

  <!-- Right node -->
  <circle cx="352" cy="176" r="36" fill="url(#g2)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="352" cy="176" r="36" fill="url(#g2)" opacity="0.95"/>

  <!-- Bottom center node -->
  <circle cx="256" cy="352" r="36" fill="url(#g1)" filter="url(#glow)" opacity="0.95"/>
  <circle cx="256" cy="352" r="36" fill="url(#g1)" opacity="0.95"/>

  <!-- Connection: left → right -->
  <line x1="196" y1="176" x2="316" y2="176" stroke="url(#g1)" stroke-width="14" stroke-linecap="round"/>

  <!-- Connection: left → bottom -->
  <line x1="178" y1="206" x2="238" y2="326" stroke="url(#g1)" stroke-width="14" stroke-linecap="round"/>

  <!-- Connection: right → bottom -->
  <line x1="334" y1="206" x2="274" y2="326" stroke="url(#g2)" stroke-width="14" stroke-linecap="round"/>

  <!-- Top accent micro-node -->
  <circle cx="256" cy="112" r="18" fill="#38BDF8" opacity="0.9"/>
  <circle cx="256" cy="112" r="30" stroke="#38BDF8" stroke-width="2" stroke-opacity="0.2" fill="none"/>

  <!-- Accent connectors from top node -->
  <line x1="242" y1="124" x2="174" y2="158" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" opacity="0.65"/>
  <line x1="270" y1="124" x2="338" y2="158" stroke="#38BDF8" stroke-width="9" stroke-linecap="round" opacity="0.65"/>

  <!-- Output glow ring -->
  <circle cx="256" cy="352" r="60" stroke="url(#g1)" stroke-width="9" stroke-opacity="0.22" fill="none"/>

  <!-- Inner node dots -->
  <circle cx="160" cy="176" r="12" fill="white" opacity="0.25"/>
  <circle cx="352" cy="176" r="12" fill="white" opacity="0.25"/>
  <circle cx="256" cy="352" r="12" fill="white" opacity="0.25"/>
</svg>
