<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="100%" stop-color="#5EEAD4"/>
    </linearGradient>
    <linearGradient id="g2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5EEAD4"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
  </defs>

  <!-- Outer hexagon ring (faint) -->
  <polygon
    points="32,4 56,18 56,46 32,60 8,46 8,18"
    stroke="url(#g1)"
    stroke-width="1.5"
    stroke-opacity="0.18"
    fill="none"
  />

  <!-- Left node (top-left cluster) -->
  <circle cx="20" cy="22" r="4.5" fill="url(#g1)" opacity="0.92"/>

  <!-- Right node (top-right cluster) -->
  <circle cx="44" cy="22" r="4.5" fill="url(#g2)" opacity="0.92"/>

  <!-- Bottom center node -->
  <circle cx="32" cy="44" r="4.5" fill="url(#g1)" opacity="0.92"/>

  <!-- Connection: left → right (top arc — the M crossbar) -->
  <line x1="24" y1="22" x2="40" y2="22" stroke="url(#g1)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Connection: left → bottom (left leg of M / left stroke of S) -->
  <line x1="22" y1="25.5" x2="30" y2="41" stroke="url(#g1)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Connection: right → bottom (right leg) -->
  <line x1="42" y1="25.5" x2="34" y2="41" stroke="url(#g2)" stroke-width="1.8" stroke-linecap="round"/>

  <!-- Accent micro-node: center of top edge (attention head) -->
  <circle cx="32" cy="14" r="2.2" fill="#38BDF8" opacity="0.85"/>

  <!-- Accent connector: top micro → left node -->
  <line x1="30.2" y1="15.6" x2="21.5" y2="19.5" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Accent connector: top micro → right node -->
  <line x1="33.8" y1="15.6" x2="42.5" y2="19.5" stroke="#38BDF8" stroke-width="1.2" stroke-linecap="round" opacity="0.7"/>

  <!-- Bottom anchor ring (output node glow) -->
  <circle cx="32" cy="44" r="7.5" stroke="url(#g1)" stroke-width="1.2" stroke-opacity="0.28" fill="none"/>
</svg>
